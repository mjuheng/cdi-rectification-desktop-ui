name: Build Linux ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Ubuntu 20.04 container (glibc 2.31)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            --env ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/" \
            --env ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/" \
            ubuntu:20.04 \
            bash -c "
              set -e && \
              echo '=== System Info ===' && \
              cat /etc/os-release && \
              ldd --version | head -1 && \
              echo '' && \
              echo '=== Installing dependencies ===' && \
              apt-get update && \
              apt-get install -y \
                curl \
                wget \
                ca-certificates \
                binutils \
                libnss3 \
                libatk1.0-0 \
                libatk-bridge2.0-0 \
                libcups2 \
                libdrm2 \
                libxkbcommon0 \
                libxcomposite1 \
                libxdamage1 \
                libxfixes3 \
                libxrandr2 \
                libgbm1 \
                libpango-1.0-0 \
                libcairo2 \
                libasound2 \
                libatspi2.0-0 \
                libdbus-1-3 \
                libexpat1 \
                fontconfig \
                libuuid1 \
                libsm6 \
                libice6 \
                libxtst6 \
                libglib2.0-0 \
                && rm -rf /var/lib/apt/lists/* && \
              echo '' && \
              echo '=== Installing Node.js 20 ===' && \
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && \
              apt-get update && \
              apt-get install -y nodejs && \
              echo '' && \
              echo '=== Node.js version ===' && \
              node --version && \
              npm --version && \
              echo '' && \
              echo '=== Configuring npm ===' && \
              npm config set strict-ssl false && \
              npm config set registry https://registry.npmmirror.com && \
              echo '' && \
              echo '=== Installing npm dependencies ===' && \
              npm install && \
              echo '' && \
              echo '=== Building frontend assets ===' && \
              npm run build && \
              echo '' && \
              echo '=== Configuring npm for ARM64 ===' && \
              npm config set arch arm64 && \
              npm config set target_arch arm64 && \
              echo '' && \
              echo '=== Installing ARM64 Electron ===' && \
              npm uninstall electron || true && \
              npm install electron@38.1.2 --platform=linux --arch=arm64 --save-dev && \
              echo '' && \
              echo '=== Building Linux ARM64 deb ===' && \
              npx electron-builder --linux deb --arm64 --publish=never
            "

      - name: Verify build artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -lh build/ || echo "No build directory found"

          if [ -f build/*.deb ]; then
            echo ""
            echo "=== Package info ==="
            dpkg -I build/*.deb

            echo ""
            echo "=== Checking executable architecture ==="
            mkdir -p /tmp/deb-check
            dpkg-deb -x build/*.deb /tmp/deb-check
            find /tmp/deb-check -type f -executable -exec file {} \; | grep -E "(electron|cdi)" | head -10

            echo ""
            echo "=== Checking glibc requirements ==="
            ELECTRON_BIN=$(find /tmp/deb-check -name "electron" -type f | head -1)
            if [ -n "$ELECTRON_BIN" ]; then
              GLIBC_VERSIONS=$(objdump -T "$ELECTRON_BIN" 2>/dev/null | grep GLIBC_ | awk '{print $5}' | sort -V -u)
              echo "GLIBC versions required:"
              echo "$GLIBC_VERSIONS"

              MAX_GLIBC=$(echo "$GLIBC_VERSIONS" | tail -1)
              echo ""
              echo "Maximum GLIBC version required: $MAX_GLIBC"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packages
          path: build/*.deb
          retention-days: 30